<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Element Savaşları</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Dokunmatik kaydırma çakışmalarını engeller */
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Lilita One', cursive, sans-serif;
            background-color: #000;
        }

        /* --- BRAWL STARS MENÜSÜ --- */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2b78ff 0%, #002266 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
            padding: 20px 0;
        }

        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; background: rgba(0, 0, 0, 0.4);
            border-bottom: 3px solid rgba(255, 255, 255, 0.2);
            z-index: 1001;
        }
        .profile-name { color: white; font-size: 24px; text-shadow: 2px 2px 0 #000; }
        .coins { color: #ffcc00; font-size: 24px; text-shadow: 2px 2px 0 #000; }

        .menu-title {
            font-size: 3.5rem; color: #fff;
            text-shadow: 0px 6px 0px #003399, -2px -2px 0px #000, 2px -2px 0px #000;
            margin-bottom: 20px; text-align: center; transform: skew(-5deg);
        }

        .character-select-container {
            display: flex; gap: 15px; overflow-x: auto; width: 90%; max-width: 800px; padding: 15px;
            background: rgba(0, 0, 0, 0.5); border-radius: 15px; border: 3px solid #4d94ff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8); min-height: 140px; align-items: center;
            touch-action: pan-x; pointer-events: auto;
        }

        .char-card {
            min-width: 90px; height: 110px; background: #2a2a2a; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 4px solid #111; cursor: pointer; flex-shrink: 0;
        }

        .char-card.selected {
            border-color: #66ff33; background: #f0f0f0; transform: scale(1.05);
        }
        .char-card.selected .char-name { color: #000; }
        .char-icon { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #000; margin-bottom: 6px; }
        .char-name { font-size: 14px; color: #fff; }

        .btn-play {
            position: absolute; bottom: 30px; right: 30px; width: 180px; height: 70px;
            background: linear-gradient(180deg, #ffeb3b 0%, #ff9800 100%);
            border: 4px solid #fff; border-radius: 15px; font-size: 2.2rem;
            font-family: 'Lilita One', cursive; color: #fff;
            text-shadow: 3px 3px 0px #cc5200; cursor: pointer; z-index: 1001;
            pointer-events: auto;
        }

        /* --- OYUN İÇİ ARAYÜZ VE MOBİL KONTROLLER --- */
        #game-ui {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }

        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: rgba(255, 255, 255, 0.9); border: 2px solid #000; border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Dokunmatik Joystick */
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px;
            background: rgba(0, 0, 0, 0.4); border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; pointer-events: auto;
        }

        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: #ffffff; border: 3px solid #000; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        /* Mobil Butonlar */
        .touch-btn {
            position: absolute; border: 3px solid #000; border-radius: 50%; pointer-events: auto;
            display: flex; justify-content: center; align-items: center; text-align: center;
            color: white; font-size: 12px; text-shadow: 1px 1px 0px #000; line-height: 1.1;
            box-shadow: 0 4px 0px #000; cursor: pointer;
        }
        
        #btn-jump-mobile { bottom: 30px; right: 30px; width: 80px; height: 80px; font-size: 16px; background: #0066cc; }
        #btn-punch-mobile { bottom: 120px; right: 30px; width: 70px; height: 70px; background: #ff9900; }
        #btn-ability-q { bottom: 30px; right: 120px; width: 70px; height: 70px; background: #9900cc; }
        #btn-ability-r { bottom: 120px; right: 110px; width: 70px; height: 70px; background: #009933; }

        /* Kamera Dokunma Alanı (Tüm Ekran) */
        #touch-camera-zone {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: auto; z-index: 1;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-overlay">
        <div class="top-bar">
            <div class="profile-name">ElementUstasi</div>
            <div class="coins">🪙 2750</div>
        </div>
        <div class="menu-title">ELEMENT<br>SAVAŞLARI</div>
        <div class="character-select-container" id="char-container"></div>
        <button class="btn-play" id="btn-start">OYNA</button>
    </div>

    <div id="touch-camera-zone"></div>

    <div id="game-ui">
        <div class="crosshair"></div>
        
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        
        <div class="touch-btn" id="btn-ability-q">YENİĞİ<br>(Q)</div>
        <div class="touch-btn" id="btn-ability-r">GÜÇ<br>(R)</div>
        <div class="touch-btn" id="btn-punch-mobile">SALDIR</div>
        <div class="touch-btn" id="btn-jump-mobile">ZIPLA</div>
    </div>

    <script>
        const CHARACTERS = [
            { name: "Ateş", color: "#ff3300" },
            { name: "Su", color: "#0099ff" },
            { name: "Hava", color: "#99ffff" },
            { name: "Toprak", color: "#8b5a2b" },
            { name: "Şimşek", color: "#ffff00" },
            { name: "Buz", color: "#00ffff" },
            { name: "Gölge", color: "#4b0082" },
            { name: "Işık", color: "#fff8dc" }
        ];

        let selectedChar = CHARACTERS[0];

        function renderCharacterCards() {
            const charContainer = document.getElementById('char-container');
            if(!charContainer) return;
            charContainer.innerHTML = '';
            CHARACTERS.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = `char-card ${index === 0 ? 'selected' : ''}`;
                card.onclick = () => {
                    document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedChar = char;
                };
                const icon = document.createElement('div'); icon.className = 'char-icon'; icon.style.background = char.color;
                const name = document.createElement('div'); name.className = 'char-name'; name.innerText = char.name;
                card.appendChild(icon); card.appendChild(name); charContainer.appendChild(card);
            });
        }
        renderCharacterCards();

        /* --- THREE.JS KURULUMU VE HAREKET SİSTEMİ --- */
        let scene, camera, renderer;
        let yaw = 0, pitch = 0;
        let keys = { w: false, a: false, s: false, d: false };
        let joyX = 0, joyY = 0;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 0);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Zemin
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            setupPCControls();
            setupMobileControls();
        }

        /* --- PC KONTROLLERİ (WASD + Fare ile bakma) --- */
        function setupPCControls() {
            document.addEventListener('click', (e) => {
                // Menüye basılmadığında pointer lock çalışsın
                if (document.getElementById('game-ui').style.display === 'block' && e.target.id === 'touch-camera-zone') {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                    camera.rotation.x = pitch;
                    camera.rotation.y = yaw;
                }
            });

            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if (keys.hasOwnProperty(k)) keys[k] = true;
            });
            window.addEventListener('keyup', e => {
                const k = e.key.toLowerCase();
                if (keys.hasOwnProperty(k)) keys[k] = false;
            });
        }

        /* --- MOBİL DOKUNMATİK SİSTEM (Kamera + Joystick) --- */
        function setupMobileControls() {
            const cameraZone = document.getElementById('touch-camera-zone');
            const joyZone = document.getElementById('joystick-zone');
            const joyKnob = document.getElementById('joystick-knob');

            let cameraTouchId = null;
            let joyTouchId = null;
            let lastTouchX = 0, lastTouchY = 0;

            cameraZone.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    // Ekranın sağ tarafı kamera döndürmek için
                    if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            cameraZone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === cameraTouchId) {
                        const deltaX = touch.clientX - lastTouchX;
                        const deltaY = touch.clientY - lastTouchY;

                        yaw -= deltaX * 0.005;
                        pitch -= deltaY * 0.005;
                        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                        
                        camera.rotation.x = pitch;
                        camera.rotation.y = yaw;

                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            });

            const resetCameraTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === cameraTouchId) cameraTouchId = null;
                }
            };
            cameraZone.addEventListener('touchend', resetCameraTouch);
            cameraZone.addEventListener('touchcancel', resetCameraTouch);

            // Joystick Hareket Algılama
            joyZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
            });

            joyZone.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joyTouchId) {
                        const rect = joyZone.getBoundingClientRect();
                        let dx = touch.clientX - (rect.left + rect.width / 2);
                        let dy = touch.clientY - (rect.top + rect.height / 2);
                        
                        const dist = Math.hypot(dx, dy);
                        const maxDist = 35;

                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        joyX = dx / maxDist;
                        joyY = dy / maxDist;
                    }
                }
            });

            const resetJoy = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joyTouchId) {
                        joyTouchId = null;
                        joyKnob.style.transform = 'translate(-50%, -50%)';
                        joyX = 0; joyY = 0;
                    }
                }
            };
            joyZone.addEventListener('touchend', resetJoy);
            joyZone.addEventListener('touchcancel', resetJoy);
        }

        /* --- OYUN DÖNGÜSÜ --- */
        function animate() {
            requestAnimationFrame(animate);

            let moveVector = new THREE.Vector3();

            // Klavye Girdileri
            if (keys.w) moveVector.z -= 1;
            if (keys.s) moveVector.z += 1;
            if (keys.a) moveVector.x -= 1;
            if (keys.d) moveVector.x += 1;

            // Joystick Girdileri
            if (joyX !== 0 || joyY !== 0) {
                moveVector.x = joyX;
                moveVector.z = joyY;
            }

            if (moveVector.length() > 0) {
                moveVector.normalize();
                moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.addScaledVector(moveVector, 0.2);
            }

            renderer.render(scene, camera);
        }

        /* --- BAŞLATMA --- */
        document.getElementById('btn-start').onclick = () => {
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            initScene();
            animate();
        };
    </script>
</body>
</html>
